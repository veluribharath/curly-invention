name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed lib test

      # Infos are reported but don't fail the build.
      - run: flutter analyze --no-fatal-infos

      # No TMDB key or Firebase: tests run on the mock catalog.
      - run: flutter test
